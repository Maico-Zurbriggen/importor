<section class="center section-hall">
  <button mat-icon-button aria-label="Volver atrás" (click)="goBack()" class="btn-fixed">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h2>Sala</h2>
  <section class="center section-hall">
    <section class="code-container" (click)="copyCode($event)">
      <p>
        Código de sala: <span class="code">{{ code() }}</span>
      </p>
    </section>
    <mat-select [disabled]="noAdmin()" class="mat-select" (selectionChange)="onChangeCategory($event)" [value]="selectedCategory()">
      @for(category of categories; track category){
      <mat-option [value]="category">
        {{ category }}
      </mat-option>
      }
    </mat-select>
    <mat-select
      [disabled]="noAdmin()"
      class="mat-select"
      (selectionChange)="onChangeNumberImpostors($event)"
      [value]="selectedNumberImpostors()"
    >
      <mat-option [value]="0"> Cantidad de impostores </mat-option>
      <mat-option [value]="1"> 1 </mat-option>
      <mat-option [value]="2"> 2 </mat-option>
    </mat-select>
  </section>
  <section class="players-container">
    @for(player of players(); track player; let i = $index) {
    <section class="player-container" [ngClass]="'player' + (i + 1)">
      <p>{{ player }}</p>
      @if(i === 0){
      <p>Admin</p>
      }
    </section>
    }
  </section>
  <button mat-raised-button color="primary" class="btn" [disabled]="noAdmin()" (click)="startGame()">Jugar</button>
</section>
