<h2 mat-dialog-title>Ingresar código de sala</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Código</mat-label>
    <input matInput [formControl]="codeControl" placeholder="Ej: 123456" />
    @if (codeControl.hasError('required')) {
      <mat-error> El código es obligatorio </mat-error>
    }
    @if (codeControl.hasError('pattern')) {
      <mat-error> Debe ser una cadena de 6 dígitos </mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="btn-dialog" mat-button (click)="close()">Cancelar</button>
  <button
    class="btn-dialog"
    mat-raised-button
    color="primary"
    [disabled]="codeControl.invalid"
    (click)="join()"
  >
    Unirse
  </button>
</mat-dialog-actions>
